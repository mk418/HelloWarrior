# Release workflow — fires when you push a tag matching v* (e.g. v0.1.0).
# Builds the addon zip via BigWigs Packager (which reads .pkgmeta), then:
#   - Uploads to CurseForge if CF_API_KEY is set in repo secrets and the
#     TOC has an X-Curse-Project-ID header.
#   - Creates a GitHub Release with the zip(s) attached, using the
#     auto-provided GITHUB_TOKEN — no setup needed.
#
# Until CF_API_KEY + X-Curse-Project-ID are in place, the CurseForge
# upload step is silently skipped; the GitHub Release still happens.
#
# To publish a new version:
#   1. Bump `## Version:` in HelloWarrior.toc
#   2. git commit + push
#   3. git tag v0.1.0 && git push origin v0.1.0
# The workflow will fire on the tag push, not on the version bump.
#
# Commit messages are public: the changelog is built from the body of every
# commit in the tag range. Trailers (Co-Authored-By, Signed-off-by, …) are
# filtered out of it by .github/changelog.sh — see that script and the
# `manual-changelog` block in .pkgmeta. Everything else you write in a commit
# body shows up verbatim under the next version heading.

name: Release

on:
  push:
    tags:
      - 'v*'

# Required for the packager to create a GitHub Release.
permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history so the packager can generate a changelog from
          # the commits between this tag and the previous one.
          fetch-depth: 0

      # The TOC carries a literal version rather than @project-version@, so it
      # can drift from the tag being released. Catch that here, before the
      # packager uploads a zip whose in-game version is wrong.
      - name: Verify tag matches TOC version
        run: |
          toc_version=$(sed -n 's/^## Version:[[:space:]]*//p' HelloWarrior.toc | tr -d '[:space:]')
          tag_version="${GITHUB_REF_NAME#v}"
          if [ -z "$toc_version" ]; then
            echo "::error::No '## Version:' header found in HelloWarrior.toc"
            exit 1
          fi
          if [ "$toc_version" != "$tag_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME expects version $tag_version, but HelloWarrior.toc says $toc_version — bump the TOC to match and retag."
            exit 1
          fi
          echo "TOC version $toc_version matches tag $GITHUB_REF_NAME."

      # Must run before the packager: it writes the CHANGELOG.md that .pkgmeta
      # declares as the manual changelog, which is what the packager then uses
      # for the GitHub Release body, the CurseForge upload and release.json.
      # Left to itself the packager generates that changelog from raw commit
      # bodies, trailers and all.
      # Invoked through bash rather than executed: this repo keeps every file at
      # mode 644 (see "Normalize file modes to 644"), and core.fileMode is off
      # locally, so the executable bit would not survive a commit anyway.
      - name: Generate changelog
        run: bash .github/changelog.sh "$GITHUB_REF_NAME"

      - name: Package and release
        uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
